name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      evidence_ref:
        description: Commit containing detached certification authority and evidence
        required: false
        type: string

permissions:
  contents: read

jobs:
  package-release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.evidence_ref != '' }}
        with:
          ref: ${{ inputs.evidence_ref }}
          path: certification-evidence
      - name: Pack exact release artifact
        run: |
          mkdir -p release-artifact
          authority=tests/evidence/windows-release-0.5.0.json
          if [ -n '${{ inputs.evidence_ref }}' ]; then
            authority=certification-evidence/tests/evidence/windows-release-0.5.0.json
          fi
          source_commit=$(python -c "import json; print(json.load(open('$authority', encoding='utf-8'))['sourceCommit'])")
          artifact_name=$(python -c "import json; print(json.load(open('$authority', encoding='utf-8'))['artifactName'])")
          expected_sha=$(python -c "import json; print(json.load(open('$authority', encoding='utf-8'))['candidateSha256'])")
          if [ -n '${{ inputs.evidence_ref }}' ]; then
            test "$GITHUB_SHA" = "$source_commit"
          fi
          git archive --format=zip --output "release-artifact/$artifact_name" "$source_commit"
          echo "$expected_sha  release-artifact/$artifact_name" | sha256sum --check --strict
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeops-release-candidate
          path: release-artifact/*.zip
          if-no-files-found: error

  validate-ubuntu:
    needs: package-release-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.evidence_ref != '' }}
        with:
          ref: ${{ inputs.evidence_ref }}
          path: certification-evidence
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Select certification evidence
        run: |
          evidence="$GITHUB_WORKSPACE/tests/evidence"
          if [ -n '${{ inputs.evidence_ref }}' ]; then
            evidence="$GITHUB_WORKSPACE/certification-evidence/tests/evidence"
          fi
          echo "CODEOPS_WINDOWS_EVIDENCE_ROOT=$evidence" >> "$GITHUB_ENV"
          echo "CODEOPS_WINDOWS_RELEASE_AUTHORITY=$evidence/windows-release-0.5.0.json" >> "$GITHUB_ENV"
      - run: ./scripts/validate-codex.sh
      - run: ./scripts/docs-check.sh
      - run: ./scripts/migration-check.sh
      - run: ./scripts/roadmap-sync-check.sh
      - run: ./scripts/compact-check.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codeops-release-candidate
          path: ${{ runner.temp }}/release-artifact
      - name: Run all five gates from installed release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/installed-codeops"
          candidate=$(find "$RUNNER_TEMP/release-artifact" -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$candidate"
          unzip -q "$candidate" -d "$RUNNER_TEMP/installed-codeops"
          cd "$RUNNER_TEMP/installed-codeops"
          export CODEOPS_WINDOWS_CANDIDATE="$candidate"
          for launcher in validate-codex docs-check migration-check roadmap-sync-check compact-check; do
            test -x "./scripts/$launcher.sh"
          done
          ./scripts/validate-codex.sh
          ./scripts/docs-check.sh
          ./scripts/migration-check.sh
          ./scripts/roadmap-sync-check.sh
          ./scripts/compact-check.sh

  validate-windows-11-arm:
    needs: package-release-artifact
    runs-on: windows-11-arm
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
        working-directory: source with spaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source with spaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.evidence_ref != '' }}
        with:
          ref: ${{ inputs.evidence_ref }}
          path: source with spaces/certification-evidence
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Install native Codex CLI authority
        run: |
          $metadata = & npm pack '@openai/codex@0.146.0' --pack-destination $env:RUNNER_TEMP --json | ConvertFrom-Json
          if ($metadata.integrity -ne 'sha512-yG3sPWNda/2YAIQIDq9MrrjoCTIQ7rxYM5IasrG3VBcuhCLTkgeg/JzqmJq1V98RE4MJ5jCxDXXQlOjrditFRw==') {
            throw 'Codex package integrity mismatch'
          }
          npm install --global (Join-Path $env:RUNNER_TEMP $metadata.filename)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmRoot = & npm root --global
          $matches = @(
            Get-ChildItem -LiteralPath $npmRoot -Recurse -File -Filter codex.exe |
              Where-Object { $_.FullName -match 'aarch64-pc-windows-msvc' }
          )
          if ($matches.Count -ne 1) { throw "Expected one native ARM64 Codex binary, found $($matches.Count)" }
          $source = $matches[0].FullName
          $bin = Join-Path $env:RUNNER_TEMP 'native-codex-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $bin 'codex.exe')
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin -Encoding utf8
      - name: Assert native Windows 11 ARM64 runner
        run: |
          if ([Environment]::OSVersion.Version.Build -lt 22000) { throw 'Windows 11 build required' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'Native ARM64 runner required' }
      - name: Resolve certified Python and install dependencies
        run: |
          $python = & .\scripts\codeops-windows-preflight.ps1 -ResolvePython
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --require-hashes -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select certification evidence
        run: |
          $evidence = Join-Path $PWD 'tests\evidence'
          if ('${{ inputs.evidence_ref }}') {
            $evidence = Join-Path $PWD 'certification-evidence\tests\evidence'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CODEOPS_WINDOWS_EVIDENCE_ROOT=$evidence" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CODEOPS_WINDOWS_RELEASE_AUTHORITY=$(Join-Path $evidence 'windows-release-0.5.0.json')" -Encoding utf8
      - name: Run native Windows conformance tests
        run: |
          $env:CODEOPS_VERIFY_CHILD = '1'
          $python = & .\scripts\codeops-windows-preflight.ps1 -ResolvePython
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests/conformance -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all five native logical gates
        run: |
          & .\scripts\codeops-verify.ps1 all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codeops-release-candidate
          path: ${{ runner.temp }}\release-artifact
      - name: Run all five gates from installed release artifact
        run: |
          $sourceRoot = $PWD.Path
          $archives = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-artifact') -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected one release candidate archive, found $($archives.Count)" }
          $archive = $archives[0].FullName
          $installed = Join-Path $env:RUNNER_TEMP 'installed-codeops'
          Expand-Archive -LiteralPath $archive -DestinationPath $installed
          Set-Location -LiteralPath $installed
          $env:CODEOPS_WINDOWS_CANDIDATE = $archive
          & .\scripts\codeops-verify.ps1 all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
